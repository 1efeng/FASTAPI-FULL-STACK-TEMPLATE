# Self-hosted SearXNG settings for the Travel Agent search service.
# Local private instance: rate limiting, image proxy and public-instance
# features are disabled on purpose (no Redis dependency, API only).
use_default_settings: true

server:
  # Read from SEARXNG_SECRET env (see SettingsValue environ_name); placeholder
  # only. Compose injects a generated value.
  secret_key: "ultrasecretkey"
  # Private instance behind host port mapping; API consumer is the backend.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  formats:
    - html
    - json

outgoing:
  # WSL2 dev box has no direct egress; engine requests must go through the
  # loopback proxy (host-network mode). On servers with direct internet access
  # remove this `proxies` block entirely.
  proxies:
    http: http://127.0.0.1:7897
    https: http://127.0.0.1:7897

# Keep engines that work well without an API key and tolerate our travel
# queries; defaults inherit from `use_default_settings: true`.
engines:
  # Default-enabled general engines (duckduckgo/brave/startpage/google cse) are
  # frequently rate-limited or key-gated. These no-key engines are disabled by
  # default upstream; enable them so text search still has working backends.
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
    # mojeek returns calendar-spam and gibberish pages for Chinese queries
    # (confirmed in runtime logs); keep it available but last in ranking.
    weight: 0.1
  - name: qwant
    disabled: false

general:
  instance_name: "Travel Agent Search"
  debug: false