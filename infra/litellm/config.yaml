model_list:
  # Primary: DeepSeek V4 Flash through the Volcengine Agent Plan endpoint.
  - model_name: travel-agent-llm
    litellm_params:
      model: openai/deepseek-v4-flash
      mode: responses
      api_base: os.environ/DOUBAO_PLAN_BASE_URL
      api_key: os.environ/DOUBAO_PLAN_API_KEY
      timeout: 120
      stream_timeout: 120
      rpm: 600
      tpm: 1000000
      max_parallel_requests: 100
    model_info:
      mode: responses
      supports_function_calling: true
      supports_response_schema: true

  - model_name: travel-doubao
    litellm_params:
      model: openai/doubao-seed-2-0-lite-260428
      api_base: os.environ/DOUBAO_BASE_URL
      api_key: os.environ/DOUBAO_API_KEY
      additional_drop_params: ["metadata"]
      timeout: 120
      stream_timeout: 120
      rpm: 600
      tpm: 1000000
      max_parallel_requests: 100

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 0
  max_fallbacks: 1
  retry_policy:
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 0
    RateLimitErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 1
  allowed_fails: 2
  cooldown_time: 60
  retry_after: 1
  fallbacks:
    - travel-agent-llm: [travel-doubao]

litellm_settings:
  drop_params: true
  request_timeout: 120
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
