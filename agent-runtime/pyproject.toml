[project]
name = "travel-agent-runtime"
version = "0.1.0"
description = "Aegra runtime graphs for travel-agent (travel-planning skill agent)"
requires-python = ">=3.12"
dependencies = [
    "aegra-cli>=0.10.4",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-sdk>=0.4.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_runtime"]
